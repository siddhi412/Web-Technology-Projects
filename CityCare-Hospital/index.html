<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CityCare Hospital - Patient Registration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CityCare Hospital</h1>
        <p class="subtitle">Online Patient Registration Portal</p>

        <div id="successMessage" class="success"></div>

        <form id="patientForm" novalidate>

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name *</label>

                <input type="text"
                       id="fullName"
                       name="fullName"
                       placeholder="Enter your full name"
                       maxlength="50"
                       required>

                <span id="nameError" class="error"></span>
            </div>


            <!-- Date of Birth -->
            <div class="form-group">
                <label for="dob">Date of Birth *</label>

                <input type="date"
                       id="dob"
                       name="dob"
                       required>

                <span id="dobError" class="error"></span>
            </div>


            <!-- Gender -->
            <div class="form-group">

                <label>Gender *</label>

                <div class="radio-group">

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Other">
                        Other
                    </label>

                </div>

                <span id="genderError" class="error"></span>
            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">Email Address *</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="example@gmail.com"
                       maxlength="100"
                       required>

                <span id="emailError" class="error"></span>
            </div>


            <!-- Mobile -->
            <div class="form-group">

                <label for="mobile">Mobile Number *</label>

                <input type="tel"
                       id="mobile"
                       name="mobile"
                       placeholder="Enter 10-digit mobile number"
                       maxlength="10"
                       required>

                <span id="mobileError" class="error"></span>
            </div>


            <!-- Blood Group -->
            <div class="form-group">

                <label for="bloodGroup">Blood Group *</label>

                <select id="bloodGroup"
                        name="bloodGroup"
                        required>

                    <option value="">
                        -- Select Blood Group --
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>

                <span id="bloodError" class="error"></span>
            </div>


            <!-- Address -->
            <div class="form-group">

                <label for="address">Address *</label>

                <textarea id="address"
                          name="address"
                          rows="4"
                          maxlength="200"
                          placeholder="Enter your complete address"
                          required></textarea>

                <span id="addressError" class="error"></span>
            </div>


            <!-- Appointment Date -->
            <div class="form-group">

                <label for="appointment">
                    Preferred Appointment Date *
                </label>

                <input type="date"
                       id="appointment"
                       name="appointment"
                       required>

                <span id="appointmentError" class="error"></span>
            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">Create Password *</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Create a strong password"
                       minlength="8"
                       maxlength="20"
                       required>

                <div id="passwordStrength"
                     class="password-strength">
                </div>

                <span id="passwordError"
                      class="error">
                </span>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password *
                </label>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Re-enter your password"
                       minlength="8"
                       maxlength="20"
                       required>

                <span id="confirmPasswordError"
                      class="error">
                </span>

            </div>


            <!-- File Upload -->
            <div class="form-group">

                <label for="medicalFile">
                    Upload Medical Document
                </label>

                <input type="file"
                       id="medicalFile"
                       name="medicalFile"
                       accept=".pdf,.jpg,.jpeg,.png">

                <span id="fileError"
                      class="error">
                </span>

            </div>


            <!-- Terms and Conditions -->
            <div class="form-group">

                <div class="checkbox-group">

                    <label>
                        <input type="checkbox"
                               id="terms"
                               name="terms">

                        I agree to the terms and conditions. *
                    </label>

                </div>

                <span id="termsError"
                      class="error">
                </span>

            </div>


            <!-- Submit Button -->
            <button type="submit">
                Register Patient
            </button>

        </form>

    </div>


    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
