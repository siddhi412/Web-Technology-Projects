<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Pharmacy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">💊 MediCare Pharmacy</a>
            <div class="ms-auto">
                <button id="loginBtn" class="btn btn-light btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#loginModal">
                    Admin Login
                </button>
                <button id="logoutBtn" class="btn btn-warning btn-sm fw-bold d-none" onclick="logout()">
                    Logout Admin
                </button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="hero-banner text-white text-center py-5">
        <div class="container">
            <h1 class="display-6 fw-bold">Your Trusted Neighborhood Pharmacy</h1>
            <p class="lead mb-4">Check live medicine stock and order essentials instantly.</p>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="🔍 Search medicines (e.g. Paracetamol, Allergy)...">
                </div>
            </div>
        </div>
    </header>

    <!-- ADMIN PANEL (Hidden until logged in) -->
    <section id="adminPanel" class="container my-4 d-none">
        <div class="card border-primary shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">
                🛠️ Store Manager: Add New Medicine
            </div>
            <div class="card-body">
                <form id="addMedForm" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="medName" class="form-control" placeholder="Medicine Name" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="medCategory" class="form-control" placeholder="Category (e.g. Fever)" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="medPrice" class="form-control" placeholder="Price (Rs.)" min="1" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="medStock" class="form-control" placeholder="Stock Qty" min="1" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100 fw-bold">+ Add Stock</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- MEDICINE INVENTORY GRID -->
    <section class="container my-5">
        <h3 class="fw-bold mb-4 text-primary">Available Medicines</h3>
        <div id="medicineGrid" class="row g-4">
            <!-- Cards load dynamically via script.js -->
        </div>
    </section>

    <!-- ORDER FORM SECTION -->
    <section id="orderSection" class="container my-5">
        <div class="card shadow-sm mx-auto order-box">
            <div class="card-body p-4">
                <h4 class="text-center fw-bold text-primary mb-3">🛒 Quick Medicine Order</h4>
                <form id="orderForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Patient / Customer Name</label>
                        <input type="text" id="custName" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Medicine</label>
                        <select id="medSelect" class="form-select" required>
                            <option value="">-- Choose Medicine --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Quantity (Strips / Packs)</label>
                        <input type="number" id="orderQty" class="form-control" value="1" min="1" max="20" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Confirm Order</button>
                </form>
            </div>
        </div>
    </section>

    <!-- ADMIN LOGIN MODAL -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Pharmacist / Admin Login</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="admin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="admin123" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-primary text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 MediCare Pharmacy | 24/7 Health Support</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
