<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-
scale=1.0">

<title>TechMart Electronics - Inventory Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1> TechMart Electronics Inventory</h1>
<p>Database-Driven CRUD Management System</p>
</header>
<div class="container">
<section class="card">
<h2 id="formTitle">Add New Product</h2>
<form id="productForm">
<input type="hidden" id="productId">
<div class="form-group">
<label for="name">Product Name:</label>
<input type="text" id="name" required
placeholder="e.g. Wireless Mouse">
</div>
<div class="form-group">
<label for="category">Category:</label>
<input type="text" id="category" required

placeholder="e.g. Accessories">
</div>
<div class="form-row">
<div class="form-group">
<label for="price">Price (₹):</label>
<input type="number" id="price" step="0.01"

required placeholder="e.g. 799">
</div>

<div class="form-group">

<label for="quantity">Quantity:</label>
<input type="number" id="quantity" required

placeholder="e.g. 50">
</div>
</div>
<div class="form-group">
<label for="description">Description:</label>
<textarea id="description" rows="2"
placeholder="Product details..."></textarea>
</div>
<div class="btn-group">
<button type="submit" id="saveBtn">Save
Product</button>
<button type="button" id="cancelBtn"
class="btn-secondary" style="display:none;">Cancel Edit</button>
</div>
</form>
<p id="formMessage" class="message"></p>
</section>
<section class="card">
<h2>Product Catalog</h2>
<p id="tableMessage" class="message"></p>
<div class="table-responsive">
<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Category</th>
<th>Price (₹)</th>
<th>Qty</th>
<th>Description</th>
<th>Actions</th>

</tr>
</thead>

<tbody id="productTableBody">
</tbody>
</table>
</div>
</section>
</div>
<script>
const API_URL = 'http://localhost:3000/api/products';
const productForm = document.getElementById('productForm');
const productIdInput =
document.getElementById('productId');
const nameInput = document.getElementById('name');
const categoryInput = document.getElementById('category');
const priceInput = document.getElementById('price');
const quantityInput = document.getElementById('quantity');
const descriptionInput =
document.getElementById('description');
const productTableBody =
document.getElementById('productTableBody');
const formMessage = document.getElementById('formMessage');
const tableMessage =
document.getElementById('tableMessage');
const formTitle = document.getElementById('formTitle');
const saveBtn = document.getElementById('saveBtn');
const cancelBtn = document.getElementById('cancelBtn');
async function fetchProducts() {
tableMessage.textContent = "Loading products...";
tableMessage.style.color = "#2980b9";
productTableBody.innerHTML = "";
try {
const response = await fetch(API_URL);
if (!response.ok) throw new Error('Failed to fetch products.');
const products = await response.json();
tableMessage.textContent = "";
if (products.length === 0) {
productTableBody.innerHTML = `<tr><td
colspan="7" class="empty-text">No products found in
inventory.</td></tr>`;
return;
}
products.forEach(product => {
const row = document.createElement('tr');

row.innerHTML = `

<td>${product.id}</td>

<td>${escapeHtml(product.name)}</td>
<td>${escapeHtml(product.category)}</td>
<td>₹${product.price}</td>
<td>${product.quantity}</td>
<td>${escapeHtml(product.description ||

'')}</td>
<td>
<button class="btn-edit"
onclick="editProduct(${product.id}, '${escapeQuote(product.name)}',
'${escapeQuote(product.category)}', ${product.price},
${product.quantity}, '${escapeQuote(product.description ||
'')}')">Edit</button>
<button class="btn-delete"
onclick="deleteProduct(${product.id})">Delete</button>
</td>
`;

productTableBody.appendChild(row);

});
} catch (error) {
tableMessage.textContent = error.message;
tableMessage.style.color = "#e74c3c";
}
}
productForm.addEventListener('submit', async (e) => {
e.preventDefault();
formMessage.textContent = "Processing...";
formMessage.style.color = "#2980b9";
const id = productIdInput.value;
const productData = {
name: nameInput.value,
category: categoryInput.value,
price: priceInput.value,
quantity: quantityInput.value,
description: descriptionInput.value
};
const method = id ? 'PUT' : 'POST';
const url = id ? `${API_URL}/${id}` : API_URL;
try {
const response = await fetch(url, {
method: method,

headers: { 'Content-Type': 'application/json'

},
body: JSON.stringify(productData)
});
const result = await response.json();
if (!response.ok) throw new Error(result.error ||
'Operation failed.');
formMessage.textContent = result.message;
formMessage.style.color = "#27ae60";
resetForm();
fetchProducts();
} catch (error) {
formMessage.textContent = error.message;
formMessage.style.color = "#e74c3c";
}
});
function editProduct(id, name, category, price, quantity,
description) {
productIdInput.value = id;
nameInput.value = name;
categoryInput.value = category;
priceInput.value = price;
quantityInput.value = quantity;
descriptionInput.value = description;
formTitle.textContent = "Update Product";
saveBtn.textContent = "Update Product";
cancelBtn.style.display = "inline-block";
window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function deleteProduct(id) {
if (!confirm("Are you sure you want to delete this product?")) return;
try {
const response = await fetch(`${API_URL}/${id}`, {
method: 'DELETE' });
const result = await response.json();
if (!response.ok) throw new Error(result.error ||
'Failed to delete.');
tableMessage.textContent = result.message;
tableMessage.style.color = "#27ae60";
fetchProducts();
} catch (error) {
tableMessage.textContent = error.message;
tableMessage.style.color = "#e74c3c";
}
}
cancelBtn.addEventListener('click', resetForm);
function resetForm() {
productForm.reset();
productIdInput.value = "";
formTitle.textContent = "Add New Product";
saveBtn.textContent = "Save Product";
cancelBtn.style.display = "none";
}
function escapeHtml(text) {
if (!text) return "";
return String(text).replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}
function escapeQuote(text) {
if (!text) return "";
return String(text).replace(/'/g, "\\'");
}
fetchProducts();
</script>
</body>
</html>
